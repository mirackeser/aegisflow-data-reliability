name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[test,a2a,mcp]"
      - name: Run unit, integration and local agent simulations
        env:
          COVERAGE_FILE: ${{ runner.temp }}/application.coverage
        run: python -m coverage run --branch --source=aegisflow_dr -m unittest discover -s tests -v
      - name: Enforce coordination/workflow coverage and report application coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/application.coverage
        run: |
          python -m coverage report --include="*/coordination/*.py" --fail-under=100
          python -m coverage report --include="*/workflow/*.py" --fail-under=100
          python -m coverage report --include="*/security/*.py,*/integration/*.py" --fail-under=100
          python -m coverage report --include="*/benchmark/core.py,*/benchmark/runner.py,*/benchmark/report.py,*/benchmark/quality.py,*/benchmark/protocol_store.py,*/benchmark/curation.py,*/benchmark/statistics.py" --fail-under=100
          python -m coverage report --include="*/advisory/*.py" --fail-under=100
          python -m coverage report
      - name: Verify installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_installed.py"

      - name: Verify installed mutual TLS outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_secure_installed.py"

      - name: Verify installed official A2A profile outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_a2a_installed.py"

      - name: Verify installed official MCP profile outside the checkout
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_mcp_installed.py"

      - name: Verify installed benchmark contracts and frozen baseline
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_benchmark_installed.py"

      - name: Verify installed offline advisory contracts
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_advisory_installed.py"

      - name: Verify installed evidence context and prompt preparation
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_context_installed.py"

      - name: Verify installed durable usage admission
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_usage_installed.py"

      - name: Verify installed one-shot advisory dispatch
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/tools/check_dispatch_installed.py"

  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-security.txt
      - run: python -m unittest discover -s tools/security_tests -v
      - name: Audit runtime and all optional profile dependencies
        run: python tools/audit_dependencies.py
      - name: Check tracked artifacts and extract historical PDF text
        run: python tools/check_repository_hygiene.py --pdf-text-dir "$RUNNER_TEMP/pdf-text"
      - name: Scan all fetched Git history and historical PDF text
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="--all" --redact --no-banner
          docker run --rm --user "$(id -u):$(id -g)" --network none \
            -v "$RUNNER_TEMP/pdf-text:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir /scan --redact --no-banner
