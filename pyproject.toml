[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow-data-reliability"
version = "0.1.0"
description = "Agentic Data Reliability research foundation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegisflow_dr = ["data/*.json", "sql/*.sql"]
