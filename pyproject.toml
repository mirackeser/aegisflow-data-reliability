[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow-data-reliability"
version = "0.1.0"
description = "Agentic Data Reliability research foundation"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"

[project.optional-dependencies]
a2a = ["a2a-sdk==1.3.0"]
mcp = ["mcp==2.3.0"]
test = ["coverage==7.17.2", "cryptography==50.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegisflow_dr = ["data/*.json", "sql/*.sql", "coordination/schemas/*.json"]
"aegisflow_dr.benchmark" = ["data/*.json", "data/*.sha256"]
