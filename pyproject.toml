[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisflow-data-reliability"
version = "0.1.0"
description = "Agentic Data Reliability research foundation"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegisflow_dr = ["data/*.json", "sql/*.sql"]
